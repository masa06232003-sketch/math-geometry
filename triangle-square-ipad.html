<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中点連結・図形探究｜三角形＋四角形</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:18px;background:#f7f9fc;color:#19324b}main{max-width:1000px;margin:auto}button{padding:11px;border:1px solid #a9bdd2;background:white;border-radius:9px;cursor:pointer;font-size:15px}button.active{background:#1765b4;color:white}.color-choice{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid #a9bdd2;border-radius:9px;background:white}.color-choice input{accent-color:#1765b4}.color-options{display:flex;gap:7px;align-items:center;flex-wrap:wrap}nav,.controls{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.control-groups{position:relative;z-index:10;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.control-group{border:1px solid #d6e1ed;background:#fff;border-radius:12px;padding:13px;display:flex;flex-wrap:wrap;align-content:start;gap:9px}.control-group h2{font-size:15px;color:#42566d;width:100%;margin:0 0 3px}.control-group button{flex-grow:1}.control-group .color-options{width:100%;flex-wrap:nowrap;gap:5px;justify-content:flex-start}.control-group .color-choice{white-space:nowrap;flex:1;justify-content:center;padding:7px 5px;margin:0}.control-group .color-options>span{white-space:nowrap;font-size:13px}.control-group .color-choice input{margin:0 3px 0 0}.control-group.utility{background:#f2f6fa}.control-group .hint{font-size:12px;color:#637487;width:100%}.stage{position:sticky;top:0;z-index:1;background:white;box-shadow:0 3px 12px rgba(25,50,75,.10);border:1px solid #d6e1ed;border-radius:12px;padding:8px}svg{width:100%;touch-action:none;user-select:none}label{margin-right:16px}#message{margin-top:12px;color:#42566d}.point{cursor:pointer;touch-action:none}.point.selected{stroke:#ff9c00;stroke-width:5}.point:focus{outline:none;stroke:#ff9c00;stroke-width:5}h1{font-size:23px} .chooser{background:#f </style><main><div id="simulator"><h2 id="shapeTitle"></h2><div class="stage"><svg id="canvas" viewBox="0 0 960 620" aria-label="図形をドラッグして動かせます"></svg></div><div class="control-groups">

(()=>{const ns='http://www.w3.org/2000/svg',svg=document.getElementById('canvas');const cases={tt:{pts:{A:[370,75],B:[100,540],C:[620,540],D:[750,160]},polys:[['A','B','C'],['D','B','C']],pairs:[['A','B','E'],['A','C','F'],['D','B','G'],['D','C','H']],order:['E','G','H','F']},tq:{pts:{A:[250,110],B:[130,530],C:[600,530],D:[620,260],E:[510,240]},polys:[['A','B','C'],['B','C','D','E']],pairs:[['A','B','F'],['A','C','G'],['B','E','H'],['D','C','J']],order:['F','H','J','G']},qq:{pts:{A:[220,110],B:[120,510],C:[570,510],D:[520,110],E:[390,230],F:[850,310]},polys:[['A','B','C','D'],['B','C','F','E']],pairs:[['A','B','G'],['D','C','H'],['B','E','I'],['C','F','J']],order:['G','H','J','I']}};let mode='tq',reverseTq=false,points={},drag=null,down=null,selected=null,guides=[],mids={},tool='move',penColor='#222222',ink=[],activeInk=null;const make=(tag,attrs={})=>{let n=document.createElementNS(ns,tag);for(let k in attrs)n.setAttribute(k,attrs[k]);return n};const line=(a,b,color='#2d80d4',dash='')=>svg.appendChild(make('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:color,'stroke-width':2.5,'stroke-dasharray':dash}));function pointSegmentDistance(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy;const t=len?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}

    const a=poly[i],b=poly[j];
    if(((a[1]>q[1])!==(b[1]>q[1])) && q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])inside=!inside;

function labelPositions(c){
  const all={...points,...mids},segments=[];

  const total=polygons.slice(0,-1).flat().length;

  for(const poly of c.polys)for(let i=0;i<poly.length;i++)segments.push([points[poly[i]],points[poly[(i+1)%poly.length]]]);
  for(let i=0;i<c.order.length;i++)segments.push([mids[c.order[i]],mids[c.order[(i+1)%c.order.length]]]);

  const offsets=[[17,-17],[-35,-17],[17,34],[-35,34],[28,7],[-47,7],[0,-30],[0,44],[33,-29],[-49,-29],[33,42],[-49,42],[45,-15],[-55,-15],[45,34],[-55,34]];

      const x=p[0]+dx,y=p[1]+dy;const rect=[x-3,y-font+3,x+font*.75+3,y+5];

      const samples=[[rect[0],rect[1]],[rect[2],rect[1]],[rect[0],rect[3]],[rect[2],rect[3]],[(rect[0]+rect[2])/2,(rect[1]+rect[3])/2]];
      // 図形の内側に文字が入る候補を強く避け、外側を優先する。
      for(const poly of polygons){
        const insideCount=samples.filter(q=>insidePolygon(q,poly)).length;
        score+=insideCount*950;
      }
      // 図形全体の中心から外に向かう候補を優先する。
      const center=samples[4], outward=[p[0]-centroid[0],p[1]-centroid[1]];
      const displacement=[center[0]-p[0],center[1]-p[1]];

      for(const [a,b] of segments){let min=Math.min(...samples.map(q=>pointSegmentDistance(q,a,b)));if(min<13)score+=(13-min)*28+95;}
      for(const [other,q] of Object.entries(all)){if(other===n)continue;const d=pointSegmentDistance(q,[rect[0],rect[1]],[rect[2],rect[3]]);if(q[0]>=rect[0]-9&&q[0]<=rect[2]+9&&q[1]>=rect[1]-9&&q[1]<=rect[3]+9)score+=400;else if(d<12)score+=60;}
      for(const r of occupied){const overlapX=Math.max(0,Math.min(rect[2],r[2])-Math.max(rect[0],r[0]));const overlapY=Math.max(0,Math.min(rect[3],r[3])-Math.max(rect[1],r[1]));score+=overlapX*overlapY*2;}

// 四角形＋三角形では、旧Dの位置をAとして、四角形を反時計回りにA,B,C,Dと命名する。
function currentCase(){
  if(mode!=='tq'||!reverseTq)return cases[mode];
  const base=cases.tq;
  const rename={A:'E',B:'C',C:'B',D:'A',E:'D'};
  const midpointRename={J:'F',F:'G',G:'H',H:'J'};
  const pts={};
  for(const [oldName,p] of Object.entries(base.pts))pts[rename[oldName]]=[960-p[0],p[1]];
  return {
    pts,
    polys:[base.polys[1].map(n=>rename[n]),base.polys[0].map(n=>rename[n])],
    pairs:base.pairs.map(([a,b,m])=>[rename[a],rename[b],midpointRename[m]]),
    order:base.order.map(m=>midpointRename[m])

function render(){svg.replaceChildren();let c=currentCase();for(let poly of c.polys){svg.appendChild(make('polygon',{points:poly.map(n=>points[n].join(',')).join(' '),fill:'#7daee0','fill-opacity':'.14',stroke:'#287ed4','stroke-width':3}))}mids={};for(let [a,b,n] of c.pairs)mids[n]=[(points[a][0]+points[b][0])/2,(points[a][1]+points[b][1])/2];{let order=c.order;svg.appendChild(make('polygon',{points:order.map(n=>mids[n].join(',')).join(' '),fill:'#cf3155','fill-opacity':'.15',stroke:'#cf3155','stroke-width':3.2,'stroke-linejoin':'round'}))}for(let [a,b] of guides){let x=points[a]||mids[a],y=points[b]||mids[b];if(x&&y)line(x,y,'#e09017','8 5')}
// ペンで描いた線は図形の上に重ねて表示する。
for(const stroke of ink){if(stroke.points.length<1)continue;svg.appendChild(make('polyline',{points:stroke.points.map(p=>p.join(',')).join(' '),fill:'none',stroke:stroke.color,'stroke-width':4.5,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'}))}
const labels=labelPositions(c);
for(let [n,p] of Object.entries(mids)){svg.appendChild(make('circle',{cx:p[0],cy:p[1],r:9,fill:'#777',stroke:selected===n?'#ff9c00':'#fff','stroke-width':selected===n?5:1,class:'point','data-name':n,tabindex:0,role:'button','aria-label':'点'+n}));let t=make('text',{x:labels[n].x,y:labels[n].y,'font-size':27,fill:'#68717c',stroke:'#fff','stroke-width':5,'paint-order':'stroke','pointer-events':'none'});t.textContent=n;svg.appendChild(t)}for(let [n,p] of Object.entries(points)){let circle=make('circle',{cx:p[0],cy:p[1],r:8,fill:'#1970bc',stroke:'#163955','stroke-width':1.5,class:'point'+(selected===n?' selected':''),'data-name':n,tabindex:0,role:'button','aria-label':'点'+n});svg.appendChild(circle);let text=make('text',{x:labels[n].x,y:labels[n].y,'font-size':31,fill:'#1466bd',stroke:'#fff','stroke-width':5,'paint-order':'stroke','pointer-events':'none'});text.textContent=n;svg.appendChild(text)}
// 指で押しやすい透明のタッチ領域。見た目の点は従来どおり。
for(const [n,p] of Object.entries({...mids,...points})){
 const hit=make('circle',{cx:p[0],cy:p[1],r:23,fill:'transparent',stroke:'none',class:'touch-target','data-name':n,role:'button','aria-label':'点'+n});
 svg.appendChild(hit);
}}
function reset(){selected=null;guides=[];ink=[];activeInk=null;points=JSON.parse(JSON.stringify(currentCase().pts));render()}function pointer(e){let r=svg.getBoundingClientRect();return [Math.max(20,Math.min(940,(e.clientX-r.left)*960/r.width)),Math.max(20,Math.min(600,(e.clientY-r.top)*620/r.height))]}function choose(n){if(!n)return;if(selected===null){selected=n;document.getElementById('message').textContent='点'+n+'を選択しました。2点目を選んでください。'}else if(selected===n){selected=null;document.getElementById('message').textContent='選択を解除しました。'}else{if(!guides.some(([a,b])=>(a===selected&&b===n)||(a===n&&b===selected)))guides.push([selected,n]);document.getElementById('message').textContent=selected+' と '+n+' を結びました。別の2点も選べます。';selected=null;}render()}
svg.addEventListener('pointerdown',e=>{
if(tool==='pen'){activeInk={points:[pointer(e)],color:penColor};ink.push(activeInk);svg.setPointerCapture(e.pointerId);render();return}
if(tool==='eraser'){const p=pointer(e);let best=-1,dist=18;ink.forEach((stroke,i)=>{for(let j=0;j<stroke.points.length;j++){const d=j?pointSegmentDistance(p,stroke.points[j-1],stroke.points[j]):Math.hypot(p[0]-stroke.points[j][0],p[1]-stroke.points[j][1]);if(d<dist){dist=d;best=i}}});if(best>=0){ink.splice(best,1);render()}return}

if(!n){const p=pointer(e);let best=Infinity;for(const [name,q] of Object.entries({...mids,...points})){const d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<best&&d<28){best=d;n=name}}}

document.getElementById('toolMove').addEventListener('click',()=>setTool('move'));
document.getElementById('toolPen').addEventListener('click',()=>setTool('pen'));document.querySelectorAll('input[name=penColor]').forEach(input=>input.addEventListener('change',()=>{if(input.checked){penColor=input.value;setTool('pen')}}));
document.getElementById('toolEraser').addEventListener('click',()=>setTool('eraser'));
document.getElementById('clearInk').addEventListener('click',()=>{ink=[];activeInk=null;render()});
document.getElementById('clearGuides').addEventListener('click',()=>{guides=[];selected=null;document.getElementById('message').textContent='補助線を消しました。';render()});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;reset();document.getElementById('message').textContent='2点を順にクリックすると補助線が引けます。'}));document.getElementById('reset').addEventListener('click',reset);


// 各図形パネルごとに独立した2つのスナップショット
const snapshots=[null,null];
function snapshotState(){return JSON.parse(JSON.stringify({points,guides,ink,mode,reverseTq}));}
function restoreSnapshot(index){
  const snap=snapshots[index];if(!snap)return;
  const state=JSON.parse(JSON.stringify(snap));
  points=state.points;guides=state.guides;ink=state.ink;
  mode=state.mode;reverseTq=state.reverseTq;
  selected=null;down=null;drag=null;activeInk=null;
  render();
  document.getElementById('message').textContent='保存'+(index+1)+'の図形を復元しました。';
}
for(let i=0;i<2;i++){
  const restore=document.getElementById('restoreSlot'+(i+1));
  document.getElementById('saveSlot'+(i+1)).addEventListener('click',()=>{
    snapshots[i]=snapshotState();
    const preview=svg.cloneNode(true);
    preview.setAttribute('xmlns',ns);
    preview.setAttribute('width','480');preview.setAttribute('height','310');
    const bg=make('rect',{x:0,y:0,width:960,height:620,fill:'#ffffff'});
    preview.insertBefore(bg,preview.firstChild);
    const thumb=document.getElementById('thumbSlot'+(i+1));
    thumb.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(preview));
    thumb.classList.add('filled');
    restore.disabled=false;restore.textContent='保存'+(i+1)+'を復元';
    document.getElementById('message').textContent='現在の図形を保存'+(i+1)+'に記録しました。';
  });
  restore.addEventListener('click',()=>restoreSnapshot(i));
}

for(let i=0;i<2;i++){
  document.getElementById('clearSlot'+(i+1)).addEventListener('click',()=>{
    snapshots[i]=null;
    const thumb=document.getElementById('thumbSlot'+(i+1));
    thumb.removeAttribute('src');thumb.classList.remove('filled');
    const restore=document.getElementById('restoreSlot'+(i+1));
    restore.disabled=true;restore.textContent='保存'+(i+1)+'：未保存';
    document.getElementById('message').textContent='保存'+(i+1)+'だけをリセットしました。現在の図形と他の保存枠はそのままです。';
  });
}

document.getElementById('shapeTitle').textContent='三角形＋四角形';reset()})();
</script></html>
